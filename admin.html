<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Little Surprise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Nunito:wght@300;400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-wrap {
            min-height: 100vh;
            min-height: 100dvh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }
        .admin-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            padding: 1.5rem;
            width: 100%;
            max-width: 600px;
        }
        .admin-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.5rem, 4vw, 2rem);
            background: linear-gradient(135deg, #ff6b9d, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }
        .answer-item {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }
        .answer-meta {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 0.25rem;
        }
        .answer-text {
            font-size: 1.1rem;
            font-weight: 700;
        }
        .empty-state {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            padding: 2rem;
        }
        .refresh-btn {
            padding: 0.8rem 1.6rem;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #ff6b9d, #fb7185);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
        .settings-row {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .settings-input {
            flex: 1;
            min-width: 220px;
            padding: 0.8rem 1rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-family: var(--font-body);
            font-size: 0.95rem;
            outline: none;
        }
        .settings-input::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }
        .status-text {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <div class="aurora-bg">
        <div class="aurora-layer layer1"></div>
        <div class="aurora-layer layer2"></div>
        <div class="aurora-layer layer3"></div>
    </div>

    <div class="admin-wrap">
        <div class="admin-card">
            <h1 class="admin-title">Answers</h1>
            <div class="settings-row">
                <input id="script-url" class="settings-input" placeholder="Paste Google Apps Script URL here" />
                <button class="refresh-btn" id="save-settings">Save</button>
                <button class="refresh-btn" id="refresh-btn">Refresh</button>
            </div>
            <p class="status-text" id="status-text"></p>
        </div>
        <div class="admin-card" id="answers-list">
            <div class="empty-state">Loading answers...</div>
        </div>
    </div>

    <script>
        const localStorageKey = 'little_surprise_answers';
        const scriptUrlKey = 'little_surprise_script_url';

        function tryParseLocalAnswers() {
            try {
                const raw = localStorage.getItem(localStorageKey);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                console.error('[admin] Failed to parse local answers', e);
                return [];
            }
        }

        function renderAnswers(items) {
            const list = document.getElementById('answers-list');
            if (!items.length) {
                list.innerHTML = '<div class="empty-state">No answers yet.<br><small>Ask her to open the site and answer. Then refresh here.</small></div>';
                return;
            }

            list.innerHTML = items.map(item => {
                const date = item.time ? new Date(item.time).toLocaleString() : '';
                const source = item.source || 'Local';
                return `
                    <div class="answer-item">
                        <div class="answer-meta">${escapeHtml(date)} · ${source}</div>
                        <div class="answer-text">${escapeHtml(item.text || item.answer)}</div>
                    </div>
                `;
            }).join('');
        }

        async function loadAnswers() {
            const list = document.getElementById('answers-list');
            list.innerHTML = '<div class="empty-state">Loading answers...</div>';

            const local = tryParseLocalAnswers();
            const all = [...local.map(i => ({...i, source: 'Local'}))];
            const scriptUrl = localStorage.getItem(scriptUrlKey) || '';

            if (scriptUrl) {
                try {
                    const res = await fetch(scriptUrl, { method: 'GET' });
                    if (res.ok) {
                        const remote = await res.json();
                        if (Array.isArray(remote)) {
                            all.push(...remote.map(i => ({...i, source: 'Remote'})));
                        }
                    }
                } catch (e) {
                    console.error('[admin] Remote load failed', e);
                }
            }

            all.sort((a, b) => new Date(b.time || b.created_at) - new Date(a.time || a.created_at));
            renderAnswers(all);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('refresh-btn').addEventListener('click', loadAnswers);

        const urlInput = document.getElementById('script-url');
        const saveBtn = document.getElementById('save-settings');
        const statusText = document.getElementById('status-text');

        if (urlInput) {
            urlInput.value = localStorage.getItem(scriptUrlKey) || '';
        }

        saveBtn.addEventListener('click', () => {
            const url = urlInput.value.trim();
            if (!url) {
                statusText.textContent = 'Please paste a URL first.';
                return;
            }
            localStorage.setItem(scriptUrlKey, url);
            statusText.textContent = 'Saved. You can now view remote answers.';
            loadAnswers();
        });

        loadAnswers();
    </script>
</body>
</html>
