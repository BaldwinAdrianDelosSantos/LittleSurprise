<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Little Surprise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Nunito:wght@300;400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2026-08-03-06">
    <style>
        .admin-wrap {
            min-height: 100vh;
            min-height: 100dvh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }
        .admin-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            padding: 1.5rem;
            width: 100%;
            max-width: 600px;
        }
        .admin-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.5rem, 4vw, 2rem);
            background: linear-gradient(135deg, #ff6b9d, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }
        .answer-item {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }
        .answer-meta {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 0.25rem;
        }
        .answer-text {
            font-size: 1.1rem;
            font-weight: 700;
        }
        .answer-name {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 0.25rem;
        }
        .answer-ig {
            font-size: 0.85rem;
            color: var(--color-lavender, #c084fc);
            margin-top: 0.25rem;
        }
        .answer-device {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 0.25rem;
        }
        .empty-state {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            padding: 2rem;
        }
        .refresh-btn {
            padding: 0.8rem 1.6rem;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #ff6b9d, #fb7185);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
        .error-state {
            color: #fb7185;
            text-align: center;
            padding: 1rem;
        }
    </style>
</head>
<body>
    <div class="aurora-bg">
        <div class="aurora-layer layer1"></div>
        <div class="aurora-layer layer2"></div>
        <div class="aurora-layer layer3"></div>
    </div>

    <div class="admin-wrap">
        <div class="admin-card">
            <h1 class="admin-title">Answers</h1>
            <button class="refresh-btn" id="refresh-btn">Refresh</button>
            <p style="padding: 1rem 0 0 0; font-size: 0.85rem; color: rgba(255,255,255,0.6);">
                Answers from this device.
            </p>
        </div>
        <div class="admin-card" id="answers-list">
            <div class="empty-state">Loading answers...</div>
        </div>
    </div>

    <script>
        var localStorageKey = 'little_surprise_answers';

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function tryParseLocalAnswers() {
            try {
                var raw = localStorage.getItem(localStorageKey);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                console.error('[admin] Failed to parse local answers', e);
                return [];
            }
        }

        function renderAnswers(items) {
            var list = document.getElementById('answers-list');
            if (!items || !items.length) {
                list.innerHTML = '<div class="empty-state">No answers yet.<br><small>Answers will appear here automatically.</small></div>';
                return;
            }

            items.sort(function(a, b) {
                return new Date(b.time || 0) - new Date(a.time || 0);
            });

            var html = '';
            for (var i = 0; i < items.length; i++) {
                var item = items[i];
                var date = '';
                if (item.time) {
                    try {
                        date = new Date(item.time).toLocaleString();
                    } catch (e) {
                        date = item.time;
                    }
                }
                var nameHtml = item.name ? '<div class="answer-name">Name: ' + escapeHtml(item.name) + '</div>' : '';
                var igHtml = item.igHandle ? '<div class="answer-ig">Instagram: ' + escapeHtml(item.igHandle) + '</div>' : '';
                var deviceHtml = item.device ? '<div class="answer-device">📱 ' + escapeHtml(item.device) + '</div>' : '';

                html += '<div class="answer-item">' +
                    '<div class="answer-meta">' + escapeHtml(date) + '</div>' +
                    '<div class="answer-text">' + escapeHtml(item.text || item.answer || '') + '</div>' +
                    nameHtml +
                    igHtml +
                    deviceHtml +
                    '</div>';
            }
            list.innerHTML = html;
        }

        function loadAnswers() {
            var list = document.getElementById('answers-list');
            list.innerHTML = '<div class="empty-state">Loading answers...</div>';

            var local = tryParseLocalAnswers();
            renderAnswers(local);
        }

        document.getElementById('refresh-btn').addEventListener('click', loadAnswers);
        loadAnswers();
        setInterval(loadAnswers, 3000);
    </script>
</body>
</html>
