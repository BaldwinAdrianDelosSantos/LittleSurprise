<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Little Surprise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Nunito:wght@300;400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-wrap {
            min-height: 100vh;
            min-height: 100dvh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }
        .admin-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            padding: 1.5rem;
            width: 100%;
            max-width: 600px;
        }
        .admin-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.5rem, 4vw, 2rem);
            background: linear-gradient(135deg, #ff6b9d, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }
        .answer-item {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }
        .answer-meta {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 0.25rem;
        }
        .answer-text {
            font-size: 1.1rem;
            font-weight: 700;
        }
        .empty-state {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            padding: 2rem;
        }
        .refresh-btn {
            padding: 0.8rem 1.6rem;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #ff6b9d, #fb7185);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="aurora-bg">
        <div class="aurora-layer layer1"></div>
        <div class="aurora-layer layer2"></div>
        <div class="aurora-layer layer3"></div>
    </div>

    <div class="admin-wrap">
        <div class="admin-card">
            <h1 class="admin-title">Answers</h1>
            <button class="refresh-btn" id="refresh-btn">Refresh</button>
        </div>
        <div class="admin-card" id="answers-list">
            <div class="empty-state">Loading answers...</div>
        </div>
    </div>

    <script>
        const repoOwner = 'BaldwinAdrianDelosSantos';
        const repoName = 'LittleSurprise';

        async function loadAnswers() {
            const list = document.getElementById('answers-list');
            list.innerHTML = '<div class="empty-state">Loading answers...</div>';

            try {
                const res = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/issues?labels=answer&state=all&per_page=100`);
                if (!res.ok) throw new Error('Failed to load');
                const issues = await res.json();

                if (!issues.length) {
                    list.innerHTML = '<div class="empty-state">No answers yet.</div>';
                    return;
                }

                list.innerHTML = issues.map(issue => {
                    const date = new Date(issue.created_at).toLocaleString();
                    return `
                        <div class="answer-item">
                            <div class="answer-meta">${date}</div>
                            <div class="answer-text">${escapeHtml(issue.title.replace('New answer: ', ''))}</div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                list.innerHTML = '<div class="empty-state">Could not load answers. Check internet or repo access.</div>';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('refresh-btn').addEventListener('click', loadAnswers);
        loadAnswers();
    </script>
</body>
</html>
